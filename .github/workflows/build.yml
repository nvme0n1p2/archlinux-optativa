name: Build Arch images
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    permissions:
      contents: write
      packages: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Syyu --noconfirm && pacman -S archiso grub docker cdrkit bash fish zsh which nodejs --noconfirm

      - name: Build bootstrap tarball & iso
        run: mkarchiso -v -r -w /tmp/archiso-tmp -o ./output/ ./archsource/

      - name: Validate ISO
        run: |
          ISO=$(ls ./output/archlinux-optativa-*.iso)
          echo "ISO size: $(du -sh $ISO)"
          file $ISO | grep -q "ISO 9660" || (echo "Not a valid ISO!" && exit 1)
          MIN_BYTES=100000000
          SIZE=$(stat -c%s "$ISO")
          [ "$SIZE" -gt "$MIN_BYTES" ] || (echo "ISO too small: $SIZE bytes" && exit 1)
          isoinfo -l -i "$ISO" | grep -iE "(grub|efi|boot)" || \
            (echo "No boot files found in ISO" && exit 1)

      - name: Start docker daemon
        run: dockerd &>/tmp/dockerd.log & sleep 5

      - name: Log in to ghcr.io
        if: ${{ !env.ACT }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate docker image
        run: |
          mkdir -p /tmp/bootstrap
          tar -xJf ./output/archlinux-optativa-bootstrap-*.tar.xz -C /tmp/bootstrap/
          tar -C /tmp/bootstrap/root.x86_64 -c . | docker import - \
          --change "CMD [\"/usr/bin/bash\"]" \
          --change "ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
          ghcr.io/nvme0n1p2/archlinux-optativa:latest

      - name: Tag with commit SHA
        run: docker tag ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Test docker image
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:latest /usr/bin/bash -c "
            echo '=== OS Release ===' && cat /etc/os-release &&
            echo '=== Pacman works ===' && pacman -Q | head -5
          "
      - name: Push images
        if: ${{ !env.ACT }}
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Create date
        id: date
        run: echo "date=$(date +%Y.%m.%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Build ${{ steps.date.outputs.date }}
          files: ./output/archlinux-optativa-*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
